[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-too-long (codigo legado tem mensagens longas em PT-BR)
    "B008",  # function-call-in-default-argument (FastAPI Depends/Query usa esse padrao)
]

[tool.ruff.lint.per-file-ignores]
"_migrar_pajs.py" = ["F401", "F841", "B"]  # script legado de migracao
"stop.py" = ["B"]
# Arquivos arquivados/duplicados da automacao web do PJe (substituidos pelo
# fluxo MNI em services/pje_service.py) — mantidos so como referencia.
"ingestao/pje_web.py" = ["SIM105"]
"ingestao/pje_web_console.py" = ["F401"]
"ingestao/pje_client.py" = ["F401"]
"ferramentas/pje_web_trf3/*" = ["SIM105", "F401"]
# O regex JS embutido remove tanto `:` quanto o dois-pontos fullwidth `：`
# de labels do SISDPU — o caractere "ambiguo" e' intencional.
"ingestao/sisdpu_client.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
